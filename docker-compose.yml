version: '3.8'

services:
  campusresq-core:
    build: .
    container_name: campusresq-ai-core
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_NAME=CampusResQ_AI
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./audit_logs.jsonl:/app/audit_logs.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
